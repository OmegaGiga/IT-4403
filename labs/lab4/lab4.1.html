<!DOCTYPE html>
<html>
    <head lang="en-us">
        <meta charset="UTF-8">
        <meta name="author" content="Leonardo Mendez-Rivera">
        <meta name="description" content="Site for showcasing IT 4403 labs, exercises, and projects.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IT 4403 - Project Showcase :: Lab 4 :: Page 1</title>
        <link rel="stylesheet" href="../../css/style.css">
        <link rel="icon" type="image/x-icon" href="../../images/favicon.png">
        <script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
    </head>
    <body>
        <div class="window">
            <header>
                <div class="title-bar">
                    <button type="button">x</button>
                    <button type="button">-</button>
                    <button type="button">+</button>
                    <p>Lab 4: Page 1</p>
                </div>

                <hr>

                <div class="site-heading">
                    <h1>Lab 4: Page 1</h1>
                </div>

                <nav class="navbar">
                    <a href="../../index.html">Home</a>
                </nav>
            </header>
            
            <main class="window-content">
                <div>
                    <h3>Test RESTful Web APIs</h3>
                    <h4>User Information</h4>
                    <p id="name"></p>
                    <p id="user_name"></p>
                    <p id="email"></p>
                    <p id="address">Address: 
                        <ul id="address_list"></ul>
                    </p>
                    <p id="phone"></p>
                    <p id="website"></p>
                    <p id="company">Company: 
                        <ul id="company_list"></ul>
                    </p>

                    <hr>

                    <h4>User Album Information</h4>
                    <div id="album_list"></div>

                    <script type="text/javascript">
                        $(document).ready(function() {
                            fetch("https://jsonplaceholder.typicode.com/users/1")
                                .then(response => response.json())
                                .then(data => {
                                    $("#name").html("Name: " + data.name);
                                    $("#user_name").html("Username: " + data.username);
                                    $("#email").html("Email: " + data.email);
                                    
                                    $("#address_list").append("<li>Street: " + data.address.street + "</li>");
                                    $("#address_list").append("<li>Suite: " + data.address.suite + "</li>");
                                    $("#address_list").append("<li>City: " + data.address.city + "</li>");
                                    $("#address_list").append("<li>Zipcode: " + data.address.zipcode + "</li>");
                                    $("#address_list").append("<li>Latitude: " + data.address.geo.lat + "</li>");
                                    $("#address_list").append("<li>Longitude: " + data.address.geo.lng + "</li>");

                                    $("#phone").html("Phone: " + data.phone);
                                    $("#website").html("Website: " + data.website);
                                    $("#company_list").append("<li>Name: " + data.company.name + "</li>");
                                    $("#company_list").append("<li>Catch Phrase: " + data.company.catchPhrase + "</li>");
                                    $("#company_list").append("<li>Business Strategy: " + data.company.bs + "</li>");
                                });
                            
                            fetch("https://jsonplaceholder.typicode.com/albums?userId=1")
                                .then(response => response.json())
                                .then(data => {
                                    for (let i = 0; i < data.length; i++) {
                                        let album = $("<section>");
                                        let title = $("<p>");

                                        title.html("<a href='./lab4.2.html?albumId=" 
                                        + data[i].id + "'>" 
                                        + data[i].title 
                                        + "</a>");
                                        
                                        album.append(title);
                                        
                                        $("#album_list").append(album);
                                    }
                                });
                        });
                    </script>
                </div>
            </main>

            <hr>
            
            <footer class="footer">
                <p><a href="https://campus.kennesaw.edu/colleges-departments/ccse/academics/information-technology/" target="_blank">
                    CCSE Department of IT Website</a> | 
                    Disclaimer: This is a student website created for course projects in IT 4403.</p>
            </footer>
        </div>
    </body>
</html>
