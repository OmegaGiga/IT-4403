<!DOCTYPE html>
<html>
    <head lang="en-us">
        <meta charset="UTF-8">
        <meta name="author" content="Leonardo Mendez-Rivera">
        <meta name="description" content="Site for showcasing IT 4403 labs, exercises, and projects.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IT 4403 - Project Showcase :: Lab 4 :: Page 2</title>
        <link rel="stylesheet" href="../../css/style.css">
        <link rel="icon" type="image/x-icon" href="../../images/favicon.png">
        <script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
    </head>
    <body>
        <div class="window">
            <header>
                <div class="title-bar">
                    <button type="button">x</button>
                    <button type="button">-</button>
                    <button type="button">+</button>
                    <p>Lab 4: Page 2</p>
                </div>

                <hr>

                <div class="site-heading">
                    <h1>Lab 4: Page 2</h1>
                </div>

                <nav class="navbar">
                    <a href="../../index.html">Home</a>
                </nav>
            </header>
            
            <main class="window-content">
                <div>
                    <h3>Test RESTful Web APIs</h3>
                    <h4>User Album Information</h4>
                    <div id="album_list"></div>

                    <script type="text/javascript">
                        $(document).ready(function() { 
                            const params = new URLSearchParams(window.location.search);
                            const albumId = params.get("albumId");
                            const albumId_index = albumId - 1;
                            fetch("https://jsonplaceholder.typicode.com/albums?userId=1")
                                .then(response => response.json())
                                .then(data => {
                                    let album = $("<section>");
                                    let title = $("<p>");
                                    let album_id = $("<p>");
                                    let user_id = $("<p>");

                                    title.html("Album: "  
                                    + "<a href='./lab4.2.html?albumId=" 
                                    + data[albumId_index].id + "'>" 
                                    + data[albumId_index].title 
                                    + "</a>");

                                    album_id.html("Album ID: " + data[albumId_index].id);
                                    user_id.html("User ID: " + data[albumId_index].userId);
                                    
                                    album.append(title);
                                    album.append(album_id);
                                    album.append(user_id);

                                    $("#album_list").append(album);
                                });

                            fetch("https://jsonplaceholder.typicode.com/photos?albumId=" + albumId)
                                .then(response => response.json())
                                .then(data => {
                                    for (let i = 0; i < data.length; i++) {
                                        let album = $("<section>");
                                        let photo_title = $("<p>");
                                        let thumbnail_image = $("<img>");

                                        photo_title.html("Photo Title: " + data[i].title);
                                        thumbnail_image.attr("src", data[i].url);
                                        thumbnail_image.attr("style", "width: 250px;");
                                        thumbnail_image.attr("alt", "Album thumbnail #" + (i + 1));

                                        album.append(photo_title);
                                        album.append(thumbnail_image);
                                        
                                        $("#album_list").append(album);
                                    }
                                });
                        });
                    </script>
                </div>
            </main>

            <hr>
            
            <footer class="footer">
                <p><a href="https://campus.kennesaw.edu/colleges-departments/ccse/academics/information-technology/" target="_blank">
                    CCSE Department of IT Website</a> | 
                    Disclaimer: This is a student website created for course projects in IT 4403.</p>
            </footer>
        </div>
    </body>
</html>
